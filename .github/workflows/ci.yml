name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start a clean local Postgres database
        run: pnpm exec supabase db start

      - name: Run migrations and pgTAP tests
        run: pnpm exec supabase test db

      - name: Verify reviewed starter publication and replay in disposable Postgres
        run: pnpm exec tsx scripts/check-public-starter-local-db.ts

      - name: Verify audited correction, replay and history guards in disposable Postgres
        run: pnpm exec tsx scripts/check-article-correction-local-db.ts

      - name: Verify v2 provider allocation, accounting and replay in disposable Postgres
        run: pnpm exec tsx scripts/check-demand-provider-local-db.ts

      - name: Verify exact saved-check recovery and admission races in disposable Postgres
        run: pnpm exec tsx scripts/check-demand-check-recovery-local-db.ts

      - name: Verify v10 conversation retention and concurrent sharing in disposable Postgres
        run: pnpm exec tsx scripts/check-demand-v10-local-db.ts

      - name: Verify weekly allowance, reset contention and guest continuity in disposable Postgres
        run: pnpm exec tsx scripts/check-demand-allowance-local-db.ts

      - name: Verify invite slots, acceptance races and uncertain email recovery in disposable Postgres
        run: pnpm exec tsx scripts/check-demand-invitations-local-db.ts

      - name: Lint migrated application schemas
        run: pnpm exec supabase db lint --local --schema public,private,edison_public_api --level warning --fail-on warning
