<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fcfbf8;color:#0b0b0b;font-family:'Libre Franklin',Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#fcfbf8;border-top:5px solid #d12f32">
      <tr>
        <td align="center" style="padding:56px 24px 48px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px">
            <tr>
              <td>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="38" valign="middle" style="width:38px;padding-right:7px">
                      <img src="{{ .SiteURL }}/brand/edison-mark.svg" width="31" height="31" alt="" style="display:block;width:31px;height:31px;border:0;outline:none;text-decoration:none">
                    </td>
                    <td valign="middle" style="font-family:Newsreader,Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;letter-spacing:-.9px;line-height:.82">edison</td>
                  </tr>
                </table>

                <p style="margin:64px 0 12px;color:#d12f32;font-family:'Libre Franklin',Arial,Helvetica,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.2px;line-height:1.25;text-transform:uppercase">Private edition</p>
                <h1 style="margin:0 0 20px;font-family:'Libre Caslon Display',Georgia,'Times New Roman',serif;font-size:44px;font-weight:400;letter-spacing:-.8px;line-height:.97">Your publication is ready.</h1>
                <p style="margin:0;color:#30302e;font-family:'Libre Caslon Text',Georgia,'Times New Roman',serif;font-size:19px;line-height:1.62">Accept your private invitation to start shaping a daily publication around what you want to understand.</p>
                <p style="margin:32px 0">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite" style="display:inline-block;min-height:44px;border:1px solid #0b0b0b;border-radius:2px;background:#0b0b0b;color:#fcfbf8;padding:0 20px;font-family:'Libre Franklin',Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;line-height:44px;text-decoration:none">Accept invitation</a>
                </p>
                <p style="margin:0;padding-top:18px;border-top:1px solid #d9d7d2;color:#6d6b67;font-family:'Libre Franklin',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5">This invitation expires after Edison&#39;s configured authentication-link lifetime.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
