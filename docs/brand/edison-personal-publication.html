* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

  height: 8px;

  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,

  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {

  display: inline-flex;

  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

  overflow-wrap: anywhere;

.nav-link:disabled,

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;edison-personal-publication&quot;);
      const el = id =&gt; root.querySelector(&quot;#&quot; + id);
      const example = &quot;More economic history, less startup news. Go deeper.&quot;;
      const standard = [&quot;heat&quot;,&quot;gps&quot;,&quot;startup&quot;,&quot;trees&quot;];
      const directed = [&quot;canals&quot;,&quot;heat&quot;,&quot;gps&quot;,&quot;trees&quot;];
      const saved = new Set();
      const readIds = new Set();
      const data = {
        heat:{desk:&quot;The everyday world&quot;,title:&quot;Why the city stays warm after the sun goes down&quot;,dek:&quot;The afternoon doesn’t disappear at sunset. It’s still there, in the streets beneath your feet.&quot;,topic:&quot;Environment&quot;,body:[&quot;Sunset switches off the source of heat, not the heat itself. Roads and buildings absorb energy through the day and release it as the air cools.&quot;,&quot;A city also replaces much of the landscape that would otherwise help it cool. Vegetation provides shade and releases water into the air. Concentrate heat-absorbing structures and remove greenery, and the result can be a warmer urban area: a heat island.&quot;],source:&quot;EPA · Learn about heat island effects&quot;,url:&quot;https://www.epa.gov/heatislands/learn-about-heat-island-effects&quot;},
        gps:{desk:&quot;Science &amp; technology&quot;,title:&quot;Your phone’s blue dot needs Einstein&quot;,dek:&quot;The clocks above our heads tick differently. Getting you to the right street means accounting for it.&quot;,topic:&quot;Physics&quot;,body:[&quot;The clocks on GPS satellites do not naturally keep the same time as clocks on Earth. Their speed makes them tick more slowly, while the weaker gravity at their altitude makes them tick faster. The second effect wins.&quot;,&quot;NIST puts the combined difference at about 38 microseconds per day. GPS uses precisely timed signals from satellites to determine position, so engineers must account for the relativistic difference.&quot;],source:&quot;NIST · Putting Einstein to the test&quot;,url:&quot;https://www.nist.gov/atomic-clocks/a-powerful-tool-for-science/putting-einstein-test&quot;},
        startup:{desk:&quot;Business &amp; technology&quot;,title:&quot;Beyond the next product launch&quot;,dek:&quot;A closer look at the gap between building something new and making it part of everyday life.&quot;,topic:&quot;Startups&quot;,body:[&quot;What should count as progress: a promising demonstration, a new product, or something that people use without having to think about it?&quot;,&quot;This is an editorial-copy sample for the design. A production article would need reported examples, verified claims, and source notes before publication.&quot;],source:&quot;Editorial sample · not a researched article&quot;},
        trees:{desk:&quot;The natural world&quot;,title:&quot;A forest doesn’t just receive the weather&quot;,dek:&quot;The small exchanges at the surface of a leaf help connect the land to the sky.&quot;,topic:&quot;Living systems&quot;,body:[&quot;Plants release water vapor through transpiration, cooling themselves and their surroundings. Across a forest, those exchanges can add moisture to the air.&quot;,&quot;That moisture can contribute to cloud formation and rainfall. Climate shapes where plants can grow, while plants help change surface temperature and atmospheric humidity. The relationship depends on the landscape and atmospheric conditions.&quot;],source:&quot;NASA Earth Observatory · Seeing leaves in a new light&quot;,url:&quot;https://science.nasa.gov/earth/earth-observatory/seeing-leaves-in-a-new-light/&quot;},
        canals:{desk:&quot;Economic history&quot;,title:&quot;The infrastructure boom before the internet&quot;,dek:&quot;Canals, railways, and the questions an earlier era of building raises about today’s AI investment.&quot;,topic:&quot;Economic history&quot;,body:[&quot;Before asking whether a new technology will change the world, it is worth asking what else has to be built around it.&quot;,&quot;The proposed piece would examine the financing, complementary infrastructure, and uncertain demand behind an earlier infrastructure boom, then distinguish those conditions from today’s AI investment.&quot;,&quot;This is an editorial-copy sample, not a researched historical argument. In production, the deeper article would be written from verified sources before entering the edition.&quot;],source:&quot;Editorial sample · new writing preview, not live generation&quot;}
      };
      let state;
      let currentRead = &quot;heat&quot;;
      let before = null;
      let composing = false;
      function reset(person=&quot;returning&quot;) {
        state={person,order:[...standard],brief:person===&quot;guest&quot;?&quot;&quot;:&quot;Environment and technology. Keep a mix of familiar subjects and new ideas.&quot;,learned:person===&quot;guest&quot;?&quot;&quot;:&quot;Built environment&quot;,today:&quot;&quot;,stage:&quot;idle&quot;,scope:&quot;future&quot;};
        before=null;
        el(&quot;pp-prompt&quot;).value=&quot;&quot;;
        el(&quot;pp-scope&quot;).value=&quot;future&quot;;
        el(&quot;pp-options&quot;).hidden=true;
        el(&quot;pp-validation&quot;).hidden=true;
        el(&quot;pp-home-view&quot;).hidden=false;
        el(&quot;pp-reader&quot;).hidden=true;
        el(&quot;pp-brief-status&quot;).textContent=&quot;Changes in this reference stay in this page only.&quot;;
        render();
      }
      function escapeText(value) {return String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,char=&gt;({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&quot;\&quot;&quot;:&quot;&amp;quot;&quot;,&quot;&#x27;&quot;:&quot;&amp;#39;&quot;}[char]));}
      function reason(key) {
        if(state.person===&quot;guest&quot;&amp;&amp;!state.brief&amp;&amp;!state.today) return &quot;Part of a varied starter edition. Edison has not inferred personal interests yet.&quot;;
        if(key===&quot;canals&quot;) return &quot;You asked for more economic history and deeper explanations.&quot;;
        if(state.person===&quot;returning&quot;&amp;&amp;key===&quot;heat&quot;) return &quot;In this returning-reader example, you follow environment and technology.&quot;;
        return &quot;Kept in the mix to leave room for discovery.&quot;;
      }
      function saveButton(key) {return `&lt;button type=&quot;button&quot; class=&quot;pp-save&quot; data-save=&quot;${key}&quot; aria-label=&quot;${saved.has(key)?&quot;Unsave&quot;:&quot;Save&quot;} ${escapeText(data[key].title)}&quot; aria-pressed=&quot;${saved.has(key)}&quot;&gt;${saved.has(key)?&quot;Saved&quot;:&#x27;&lt;i data-lucide=&quot;bookmark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;}&lt;/button&gt;`;}
      function renderFeed() {
        const [lead,...rest]=state.order;
        const first=data[lead];
        el(&quot;pp-feed&quot;).innerHTML=`&lt;article class=&quot;pp-lead&quot;&gt;&lt;div&gt;&lt;p class=&quot;pp-kicker&quot;&gt;${first.desk}&lt;/p&gt;&lt;h1 class=&quot;pp-headline&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;pp-title-link&quot; data-read=&quot;${lead}&quot;&gt;${first.title}&lt;/button&gt;&lt;/h1&gt;&lt;p class=&quot;pp-dek&quot;&gt;${first.dek}&lt;/p&gt;&lt;p class=&quot;pp-meta&quot;&gt;${first.topic} · ${lead===&quot;canals&quot;?&quot;Deeper reading · sample&quot;:&quot;Prepared read&quot;}${readIds.has(lead)?&quot; · Opened&quot;:&quot;&quot;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pp-lead-note&quot;&gt;&lt;p class=&quot;pp-note-label&quot;&gt;In this edition&lt;/p&gt;&lt;p class=&quot;pp-opening&quot;&gt;${first.body[0]}&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;pp-text-action&quot; data-read=&quot;${lead}&quot;&gt;Keep reading →&lt;/button&gt;&lt;details class=&quot;pp-reason&quot;&gt;&lt;summary&gt;Why this story&lt;/summary&gt;&lt;p&gt;${reason(lead)}&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/article&gt;`+rest.map(key=&gt;{const item=data[key];return `&lt;article class=&quot;pp-story-row&quot;&gt;&lt;div&gt;&lt;p class=&quot;pp-kicker&quot;&gt;${item.desk}&lt;/p&gt;&lt;h2 class=&quot;pp-row-title&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;pp-title-link&quot; data-read=&quot;${key}&quot;&gt;${item.title}&lt;/button&gt;&lt;/h2&gt;&lt;p class=&quot;pp-row-dek&quot;&gt;${item.dek}&lt;/p&gt;&lt;p class=&quot;pp-meta&quot;&gt;${item.topic} · ${key===&quot;startup&quot;?&quot;Editorial sample&quot;:&quot;Prepared read&quot;}${readIds.has(key)?&quot; · Opened&quot;:&quot;&quot;}&lt;/p&gt;&lt;/div&gt;${saveButton(key)}&lt;/article&gt;`;}).join(&quot;&quot;);
        if(globalThis.lucide) lucide.createIcons({attrs:{width:18,height:18}});
      }
      function renderReceipt() {
        const status=state.stage;
        el(&quot;pp-receipt&quot;).hidden=status===&quot;idle&quot;;
        el(&quot;pp-undo&quot;).hidden=!before||[&quot;failed&quot;,&quot;applying&quot;].includes(status);
        el(&quot;pp-today&quot;).hidden=![&quot;ready&quot;,&quot;queued&quot;,&quot;generation-failed&quot;].includes(status)||state.scope===&quot;today&quot;||!before;
        el(&quot;pp-retry&quot;).hidden=![&quot;failed&quot;,&quot;generation-failed&quot;].includes(status);
        el(&quot;pp-retry&quot;).textContent=status===&quot;generation-failed&quot;?&quot;Retry writing&quot;:&quot;Retry saving&quot;;
        el(&quot;pp-apply&quot;).disabled=status===&quot;applying&quot;;
        const scope=state.scope===&quot;today&quot;?&quot;This edition only.&quot;:&quot;For News, from now on.&quot;;
        const changed=before?state.order.filter((key,index)=&gt;before.order[index]!==key).length:0;
        const readyChange=changed?changed+&quot; unread positions updated in this preview.&quot;:&quot;No ready stories changed; your kept reads remain in place.&quot;;
        const lines={applying:&quot;Saving your News direction. Your current edition is still available.&quot;,ready:&quot;More economic history, fewer startup stories, deeper explanations. &quot;+scope+&quot; &quot;+readyChange,queued:&quot;Direction saved. &quot;+scope+&quot; A new economic-history piece is queued; your current edition is still available.&quot;,failed:&quot;We couldn’t save your direction. Your editorial brief and edition haven’t changed.&quot;,&quot;generation-failed&quot;:&quot;Your direction is saved. &quot;+scope+&quot; The new economic-history piece couldn’t be written. Your current edition is still available.&quot;,cleared:(state.brief||state.today?&quot;Selected News instruction removed.&quot;:&quot;News instructions cleared.&quot;)+&quot; Existing reads remain available.&quot;,undone:&quot;Change undone. Your previous direction is restored. Any newly opened or saved reads remain available.&quot;};
        el(&quot;pp-receipt-text&quot;).textContent=lines[status]||&quot;&quot;;
      }
      function renderBrief() {
        const items=[];
